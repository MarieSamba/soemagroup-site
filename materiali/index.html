<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../style.css">
    <title>SOEMA | Adiplon</title>
    
    <style>
        @font-face {
            font-family: 'SuisseIntlnews';
            src: url('../../font/SuisseIntl-News.otf') format('opentype'); 
            font-weight: normal;
            font-style: normal;
        }

        body {
            background-color: rgb(251, 250, 248);
            display: flex;
            align-items: center;
            height: 100vh;
            width: 100%;
            margin-left: 2vh;
            flex-direction: column;
            overflow: hidden;
        }

        /* Classe per rimuovere underline */
        .no-underline, .no-underline:hover {
            text-decoration: none !important;
        }

        /* LINK IN ALTO A DESTRA */
        .top-right-link {
            position: fixed;
            top: 2vh;
            right: 2vh;
            font-family: 'SuisseIntlmedium', sans-serif;
            font-size: 2.5vh;
            color: rgb(29, 24, 21);
            text-decoration: none;
            z-index: 100;
            cursor: pointer;
        }
        .top-right-link:hover { text-decoration: underline; }

        /* VIDEO DI SFONDO (dentro framecentrale per coerenza, o fixed) */
        .framecentrale {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 10;
            width: 100vw;
            height: 100vh;
            margin-left: -2vh;
            flex-grow: 1;
        }

        .video-quadrato {
            height: 60vh;
            width: 60vh;
            object-fit: cover;
            display: block;
        }

        /* --- OVERRIDE PANNELLO (STATICO) --- */
        #pannello-info {
            bottom: 0 !important; /* Fisso, nessuna transizione */
            /* Colore memorizzato per i materiali */
            background-color: rgb(247, 241, 232) !important; 
            z-index: 50; 
            /* Rimosso transition */
        }

        /* --- LAYOUT PAGINA SINGOLA (Split Screen) --- */
        .single-material-container {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center; /* Centra il blocco nella pagina */
            height: 100%;
            width: 100%;
            padding-bottom: 10vh; /* Spazio per il footer */
            gap: 4vw; /* Spazio tra immagine e testo */
            margin-right: 4vh; /* Bilanciamento margini */
        }

        /* IMMAGINE 70VH QUADRATA */
        .material-hero-img {
            height: 70vh;
            width: 70vh;
            object-fit: cover;
            display: block;
            /* Nessun effetto hover richiesto qui */
        }

        /* TESTO DESCRITTIVO (Stile Info Home) */
        .material-description {
            font-family: 'SuisseIntlnews', sans-serif;
            font-size: 4vh; /* Dimensione richiesta uguale a Info Home */
            color: rgb(29, 24, 21);
            max-width: 60vh; /* Limite larghezza per leggibilità */
            line-height: 1.2;
        }

        @media (max-width: 768px) {
            .single-material-container {
                flex-direction: column;
                justify-content: flex-start;
                padding-top: 10vh;
                gap: 5vh;
            }
            .material-hero-img {
                width: 70vw;
                height: 70vw;
            }
            .material-description {
                font-size: 3vh;
                max-width: 80vw;
                text-align: center;
            }
            .video-quadrato { width: 70vw; height: 70vw; }
        }
    </style>
</head>

<body>

    <a href="../../underthesurface/index.html" class="top-right-link">Under the Surface 2052</a>

    <div class="framecentrale">
        <video autoplay muted loop playsinline class="video-quadrato">
            <source src="../../contenuti/teaser.mp4" type="video/mp4">
        </video>
    </div>

    <div id="pannello-info" class="pannello-nascosto">
 
       <div class="banner-container">
            <div class="grid-left">
                </div>

            <div class="grid-center">
                 <div class="menu-row">
                    <span onclick="window.location.href='../../materiali/index.html'" class="hover-effect" style="cursor: pointer; margin-right: 0.4vh;">Materiali,</span>
                    <span onclick="window.location.href='../../index.html?open=true'" class="hover-effect" style="cursor: pointer;">Info</span>
                </div>
            </div>
            
            <div class="grid-right">
                </div>
       </div> 
    
        <div class="single-material-container">
            
            <img src="../../contenuti/Adiplon.jpg" class="material-hero-img" alt="Adiplon">
            
            <div class="material-description">
                ADIPLON è il risultato della sintesi proteica avanzata. 
                Utilizzato per strutture portanti leggere e membrane reattive.
            </div>

        </div>
      
   </div>

   <footer style="color: rgb(29, 24, 21); z-index: 100;">
        <div class="grid-left">
            <p id="footer-brand" onclick="window.location.href='../../index.html'" class="hover-effect" style="cursor: pointer;">SOEMA</p>
        </div>
        <div class="grid-center" id="footer-center"> 
            <p id="txt-address" style="display: block; margin:0; text-align: center;">
                20037, Via Roma 123, MI <br> info@soema.com
            </p>
        </div>
        <div class="grid-right" id="subscribe-container">
            <p id="btn-iscriviti" onclick="mostraForm()" class="hover-effect" style="cursor: pointer;">Iscriviti</p>
            <form id="form-iscriviti" style="display: none;" onsubmit="inviaMail(event)">
                <input type="email" placeholder="your@email.com" required>
                <button type="submit" class="hover-effect">Invia</button>
            </form>
        </div>
    </footer>

    <script>
        function mostraForm() {
            document.getElementById('btn-iscriviti').style.display = 'none';
            document.getElementById('form-iscriviti').style.display = 'flex';
        }

        function inviaMail(e) {
            e.preventDefault(); 
            document.getElementById('form-iscriviti').style.display = 'none';
            document.getElementById('btn-iscriviti').style.display = 'block';
        }
    </script>
</body>
</html>
