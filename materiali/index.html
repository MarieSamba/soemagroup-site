<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css">
    <title>SOEMA | Materiali</title>
    
    <style>
        /* --- FONTS --- */
        @font-face {
            font-family: 'SuisseIntlnews';
            src: url('../font/SuisseIntl-News.otf') format('opentype'); 
            font-weight: normal;
            font-style: normal;
        }
        
        @font-face {
            font-family: 'SuisseIntlmedium';
            src: url('../font/SuisseIntl-Medium.otf') format('opentype'); 
            font-weight: normal;
            font-style: normal;
        }

        body {
            background-color: rgb(251, 250, 248);
            display: flex;
            align-items: center;
            height: 100vh;
            width: 100%;
            margin-left: 2vh;
            flex-direction: column;
            overflow: hidden;
            
            /* Fix font Safari */
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        /* --- FORZIAMO TUTTO IN NEWS --- */
        p, span, button, input, a {
            font-family: 'SuisseIntlnews', sans-serif;
            font-size: 2.5vh;
            color: rgb(29, 24, 21);
        }

        .no-underline, .no-underline:hover {
            text-decoration: none !important;
        }

        .top-right-link {
            position: fixed;
            top: 2vh;
            right: 2vh;
            /* Cambiato da Medium a News */
            font-family: 'SuisseIntlnews', sans-serif;
            font-size: 2.5vh;
            color: rgb(29, 24, 21);
            text-decoration: none;
            z-index: 100;
            cursor: pointer;
        }
        .top-right-link:hover { text-decoration: underline; }

        .framecentrale {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 10;
            width: 100vw;
            height: 100vh;
            margin-left: -2vh;
            flex-grow: 1;
        }

        .video-quadrato {
            height: 60vh;
            width: 60vh;
            object-fit: cover;
            display: block;
        }

        /* --- PANNELLO CHE SALE --- */
        #pannello-info {
            bottom: -100% !important; 
            background-color: rgb(247, 241, 232) !important; 
            z-index: 50; 
            transition: bottom 1s cubic-bezier(0.2, 1, 0.3, 1);
        }
        #pannello-info.slide-in {
            bottom: 0 !important;
        }

        /* === SISTEMA A GRIGLIA (Banner e Footer allineati alla Home) === */
        .banner-container, footer {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: end; 
            margin-right: 2vh;
            margin-left: 2vh;
            width: calc(100% - 4vh); 
        }

        .banner-container {
            height: 5vh; 
            align-items: center; 
        }

        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            padding-bottom: 2vh; 
            z-index: 100; 
        }

        .grid-left { justify-self: start; text-align: left; }
        .grid-center { justify-self: center; text-align: center; display: flex; flex-direction: row; align-items: center; }
        .grid-right { justify-self: end; text-align: right; }

        .grid-left p, .grid-center p, .grid-right p { margin: 0; }

        /* --- STILE INPUT FORM (Mancava in questo file) --- */
        #form-iscriviti { display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
        
        #form-iscriviti input {
            background: transparent; border: none; border-bottom: 1.5px solid rgb(29, 24, 21);
            outline: none; width: 200px; 
            font-family: 'SuisseIntlnews', sans-serif; /* News anche qui */
            font-size: 2vh; color: rgb(29, 24, 21); padding: 0;
        }
        
        #form-iscriviti button { background: transparent; border: none; cursor: pointer; padding: 0; }


        /* --- GALLERIA ORIZZONTALE --- */
        .gallery-track {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            margin-top: 4vh; 
            margin-left: 2vh; 
            height: 80vh; 
            align-items: flex-end; 
            padding-bottom: 14vh; 
            gap: 65vw; 
            scrollbar-width: none; 
            -ms-overflow-style: none;
            padding-right: 100vw; 
        }
        .gallery-track::-webkit-scrollbar { display: none; }

        .gallery-item {
            scroll-snap-align: start; 
            flex-shrink: 0;
            display: flex;
            flex-direction: column; 
            justify-content: flex-end; 
            align-items: flex-start; 
            cursor: pointer;
            gap: 1.5vh; 
            position: relative; 
        }

        .gallery-title {
            font-family: 'SuisseIntlnews', sans-serif;
            font-size: 2.5vh; 
            color: rgb(29, 24, 21);
            margin: 0; 
            padding: 0;
            white-space: nowrap; 
            text-transform: uppercase;
            transition: opacity 0.3s ease;
            z-index: 10; 
            position: relative;
        }

        .img-wrapper {
            position: relative;
            height: 40vh !important;
            width: 40vh !important;
        }

        .gallery-img {
            position: absolute; 
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
            object-fit: cover;
            transition: opacity 0.3s ease;
        }

        .img-normal { opacity: 1; z-index: 1; }
        .img-hover { opacity: 0; z-index: 2; }

        .gallery-item:hover .gallery-title { opacity: 0; }
        .gallery-item:hover .img-hover { opacity: 1; }

        .arrow-btn {
            display: inline-block;
            transition: transform 0.4s cubic-bezier(0.2, 1, 0.3, 1);
        }
        .arrow-flipped { transform: rotate(180deg); }
        
        @media (max-width: 768px) {
            .gallery-track { gap: 20vw; padding-right: 80vw; padding-bottom: 15vh; }
            .img-wrapper { width: 65vw !important; height: 65vw !important; }
            .video-quadrato { width: 70vw; height: 70vw; }
            
            footer.searching .grid-left, footer.searching .grid-center { display: none !important; }
            footer.searching { display: flex; justify-content: center; }
            footer.searching .grid-right { width: 100%; display: flex; justify-content: center; }
            footer.searching #form-iscriviti input { width: 60vw; text-align: center; }
        }
    </style>
</head>

<body>

    <a href="../underthesurface/index.html" class="top-right-link">Under the Surface 2052</a>

    <div class="framecentrale">
        <video autoplay muted loop playsinline class="video-quadrato">
            <source src="../contenuti/teaser.mp4" type="video/mp4">
        </video>
    </div>

    <div id="pannello-info" class="pannello-nascosto">
 
       <div class="banner-container">
            <div class="grid-left">
                <p id="counter-display" class="no-underline">1/4</p>
            </div>

            <div class="grid-center">
                 <div class="menu-row">
                    <span class="hover-effect" style="cursor: pointer; margin-right: 0.4vh;">Materiali,</span>
                    <span onclick="window.location.href='../index.html?open=true'" class="hover-effect" style="cursor: pointer;">Info</span>
                </div>
            </div>
            
            <div class="grid-right">
                <span id="main-arrow" onclick="gestisciClickFreccia()" class="arrow-btn no-underline" style="cursor: pointer; font-size: 2.5vh;">→</span>
            </div>
       </div> 
    
        <div class="gallery-track" id="gallery-track" onscroll="aggiornaTutto()">
            
            <div class="gallery-item" onclick="window.location.href='adiplon/index.html'">
                <p class="gallery-title">ADIPLON</p>
                <div class="img-wrapper">
                    <img src="../contenuti/Adiplon.jpg" class="gallery-img img-normal" alt="Adiplon">
                    <img src="../contenuti/etichette-adiplon.png" class="gallery-img img-hover" alt="Hover">
                </div>
            </div>

            <div class="gallery-item" onclick="window.location.href='albuphas/index.html'">
                <p class="gallery-title">ALBUPHAS</p>
                <div class="img-wrapper">
                    <img src="../contenuti/albuphas.png" class="gallery-img img-normal" alt="Albuphas">
                    <img src="../contenuti/etichette-albuphas.png" class="gallery-img img-hover" alt="Hover">
                </div>
            </div>

            <div class="gallery-item" onclick="window.location.href='emolite/index.html'">
                <p class="gallery-title">EMOLITE</p>
                <div class="img-wrapper">
                    <img src="../contenuti/Emolite.jpg" class="gallery-img img-normal" alt="Emolite">
                    <img src="../contenuti/etichette-emolite.png" class="gallery-img img-hover" alt="Hover">
                </div>
            </div>

            <div class="gallery-item" onclick="window.location.href='keratex/index.html'">
                <p class="gallery-title">KERATEX</p>
                <div class="img-wrapper">
                    <img src="../contenuti/Keratex.jpg" class="gallery-img img-normal" alt="Keratex">
                    <img src="../contenuti/etichette-keratex.png" class="gallery-img img-hover" alt="Hover">
                </div>
            </div>

        </div>
      
   </div>

   <footer style="color: rgb(29, 24, 21); z-index: 100;">
        <div class="grid-left">
            <p id="footer-brand" onclick="window.location.href='../index.html'" class="hover-effect" style="cursor: pointer;">SOEMA</p>
        </div>
        <div class="grid-center" id="footer-center"> 
            <p id="txt-address" style="display: block; margin:0; text-align: center;">
                20037, Via Roma 123, MI <br> info@soema.com
            </p>
        </div>
        <div class="grid-right" id="subscribe-container">
            <p id="btn-iscriviti" onclick="mostraForm()" class="hover-effect" style="cursor: pointer;">Iscriviti</p>
            <form id="form-iscriviti" style="display: none;" onsubmit="inviaMail(event)">
                <input type="email" placeholder="your@email.com" required>
                <button type="submit" class="hover-effect">Invia</button>
            </form>
        </div>
    </footer>

    <script>
        window.onload = function() {
            setTimeout(() => {
                document.getElementById('pannello-info').classList.add('slide-in');
            }, 100);
        };

        function gestisciClickFreccia() {
            const track = document.getElementById('gallery-track');
            const item = track.querySelector('.gallery-item');
            
            let gap = window.innerWidth > 768 ? window.innerWidth * 0.65 : window.innerWidth * 0.20;
            let totalSlotWidth = item.offsetWidth + gap;
            let current = Math.round(track.scrollLeft / totalSlotWidth) + 1;

            if (current === 1) {
                track.scrollBy({ left: totalSlotWidth, behavior: 'smooth' });
            } else {
                track.scrollBy({ left: -totalSlotWidth, behavior: 'smooth' });
            }
        }

        function aggiornaTutto() {
            const track = document.getElementById('gallery-track');
            const item = track.querySelector('.gallery-item');
            const arrow = document.getElementById('main-arrow');
            
            let gap = window.innerWidth > 768 ? window.innerWidth * 0.65 : window.innerWidth * 0.20;
            let totalSlotWidth = item.offsetWidth + gap;
            let current = Math.round(track.scrollLeft / totalSlotWidth) + 1;
            
            if(current < 1) current = 1;
            if(current > 4) current = 4;
            document.getElementById('counter-display').innerText = current + "/4";

            if (current > 1) {
                arrow.classList.add('arrow-flipped');
            } else {
                arrow.classList.remove('arrow-flipped');
            }
        }

        function mostraForm() {
            document.getElementById('btn-iscriviti').style.display = 'none';
            document.getElementById('form-iscriviti').style.display = 'flex';
            document.querySelector('footer').classList.add('searching');
        }

        function inviaMail(e) {
            e.preventDefault(); 
            document.getElementById('form-iscriviti').style.display = 'none';
            document.getElementById('btn-iscriviti').style.display = 'block';
            document.querySelector('footer').classList.remove('searching');
        }
    </script>
</body>
</html>
