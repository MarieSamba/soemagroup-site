<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css">
    <title>SOEMA | Materiali</title>
    
    <style>
        /* OVERRIDE LOCALE: 
           Solo per questa pagina, il pannello deve essere fisso aperto */
        #pannello-info {
            bottom: 0 !important; 
            background-color: rgb(185, 177, 167);
            z-index: 50; 
        }
    </style>
</head>

<body>

    <div class="framecentrale"></div>

    <div id="pannello-info" class="pannello-nascosto">
 
       <div class="banner-container">
            <div class="grid-left">
                <span onclick="scorriAvanti()" class="hover-effect arrow-btn">→</span>
            </div>

            <div class="grid-center">
                 <div class="menu-row">
                    <span class="hover-effect" style="cursor: pointer; margin-right: 0.4vh; text-decoration: underline;">Materiali,</span>
                    <span onclick="window.location.href='../index.html?open=true'" class="hover-effect" style="cursor: pointer;">Info</span>
                </div>
            </div>
            
            <div class="grid-right" onclick="scorriAvanti()" style="cursor: pointer;">
                <p id="counter-display" class="hover-effect">1/4</p>
            </div>
       </div> 
    
        <div class="gallery-container" id="gallery-track" onscroll="aggiornaContatore()">
            <img src="../contenuti/Gemini_Generated_Image_ohqf0qohqf0qohqf (1).png" class="gallery-img" onclick="centraFoto(this)">
            <img src="../contenuti/Gemini_Generated_Image_ohqf0qohqf0qohqf (1).png" class="gallery-img" onclick="centraFoto(this)">
            <img src="../contenuti/Gemini_Generated_Image_ohqf0qohqf0qohqf (1).png" class="gallery-img" onclick="centraFoto(this)">
            <img src="../contenuti/Gemini_Generated_Image_ohqf0qohqf0qohqf (1).png" class="gallery-img" onclick="centraFoto(this)">
        </div>
      
   </div>

   <footer>
        <div class="grid-left">
            <p id="footer-brand" onclick="window.location.href='../index.html'" class="hover-effect" style="cursor: pointer;">SOEMA</p>
        </div>

        <div class="grid-center" id="footer-center"> 
            <div id="txt-menu" class="menu-row">
                <span class="hover-effect" style="cursor: pointer; margin-right: 0.4vh; text-decoration: underline;">Materiali,</span>
                <span onclick="window.location.href='../index.html?open=true'" class="hover-effect" style="cursor: pointer;">Info</span>
            </div>
            
            <p id="txt-address" style="display: none; margin:0;">
                20037, Via Roma 123, MI <br> info@soema.com
            </p>
        </div>

        <div class="grid-right" id="subscribe-container">
            <p id="btn-iscriviti" onclick="mostraForm()" class="hover-effect" style="cursor: pointer;">Iscriviti</p>
            <form id="form-iscriviti" style="display: none;" onsubmit="inviaMail(event)">
                <input type="email" placeholder="your@email.com" required>
                <button type="submit" class="hover-effect">Invia</button>
            </form>
        </div>
    </footer>

    <script>
        // Scorre la galleria di 1 slot
        function scorriAvanti() {
            const track = document.getElementById('gallery-track');
            const img = track.querySelector('.gallery-img');
            // Larghezza immagine + gap (4vh)
            const gap = window.innerHeight * 0.04; 
            track.scrollBy({ left: img.offsetWidth + gap, behavior: 'smooth' });
        }

        // Centra foto al click
        function centraFoto(img) {
            img.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'start' });
        }

        // Aggiorna 1/4 mentre scorri
        function aggiornaContatore() {
            const track = document.getElementById('gallery-track');
            const images = document.querySelectorAll('.gallery-img');
            const counter = document.getElementById('counter-display');
            
            let width = images[0].offsetWidth + (window.innerHeight * 0.04); 
            let current = Math.round(track.scrollLeft / width) + 1;
            
            if(current < 1) current = 1;
            if(current > 4) current = 4;

            counter.innerText = current + "/4";
        }

        // Footer Logic
        function mostraForm() {
            document.getElementById('btn-iscriviti').style.display = 'none';
            document.getElementById('form-iscriviti').style.display = 'flex';
            document.querySelector('footer').classList.add('searching');
        }

        function inviaMail(e) {
            e.preventDefault(); 
            document.getElementById('form-iscriviti').style.display = 'none';
            document.getElementById('btn-iscriviti').style.display = 'block';
            document.querySelector('footer').classList.remove('searching');
        }
    </script>
</body>
</html>
