<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css">
    <title>SOEMA | Materiali</title>
    
    <style>
        /* --- FONTS --- */
        @font-face {
            font-family: 'SuisseIntlnews';
            src: url('font/SuisseIntl-News.otf') format('opentype'); 
            font-weight: normal;
            font-style: normal;
        }

        /* --- 1. OVERRIDE PANNELLO --- */
        #pannello-info {
            bottom: 0 !important; 
            background-color: rgb(245, 240, 234) !important; 
            z-index: 50; 
        }

        /* --- 2. GALLERIA STRUTTURA --- */
        .gallery-track {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            margin-top: 4vh; 
            margin-left: 2vh; 
            height: 65vh; 
            align-items: flex-end; 
            padding-bottom: 12vh; 
            gap: 65vw; 
            scrollbar-width: none; 
            -ms-overflow-style: none;
            padding-right: 100vw; 
        }
        .gallery-track::-webkit-scrollbar { display: none; }

        .gallery-item {
            scroll-snap-align: start; 
            flex-shrink: 0;
            display: flex;
            flex-direction: column; 
            justify-content: flex-end; 
            align-items: flex-start; 
            cursor: pointer;
            gap: 1.5vh; 
            transition: opacity 0.3s;
        }

        .gallery-title {
            font-family: 'SuisseIntlnews', sans-serif;
            font-size: 2.5vh; 
            color: rgb(29, 24, 21);
            margin: 0; 
            padding: 0;
            white-space: nowrap; 
            text-transform: uppercase;
        }

        .gallery-img {
            height: 40vh !important;
            width: 40vh !important; 
            object-fit: cover;
            display: block;
            /* Rimosso l'effetto transition per lo scale */
        }

        /* RIMOSSO l'effetto scale al passaggio del mouse */
        .gallery-item:hover .gallery-img {
            transform: none;
        }

        /* --- CONTROLLI BANNER --- */
        .no-underline {
            text-decoration: none !important;
            cursor: default;
        }

        /* --- MOBILE --- */
        @media (max-width: 768px) {
            .gallery-track {
                gap: 20vw; 
                padding-right: 80vw;
                padding-bottom: 15vh;
            }
            .gallery-img {
                width: 65vw !important; 
                height: 65vw !important; 
            }
        }
    </style>
</head>

<body>

    <div class="framecentrale"></div>

    <div id="pannello-info" class="pannello-nascosto">
 
       <div class="banner-container">
            <div class="grid-left">
                <span onclick="scorriAvantiLoop()" class="arrow-btn no-underline" style="cursor: pointer; font-size: 2.5vh;">→</span>
            </div>

            <div class="grid-center">
                 <div class="menu-row">
                    <span class="hover-effect" style="cursor: pointer; margin-right: 0.4vh;">Materiali,</span>
                    <span onclick="window.location.href='../index.html?open=true'" class="hover-effect" style="cursor: pointer;">Info</span>
                </div>
            </div>
            
            <div class="grid-right">
                <p id="counter-display" class="no-underline">1/4</p>
            </div>
       </div> 
    
        <div class="gallery-track" id="gallery-track" onscroll="aggiornaContatore()">
            
            <div class="gallery-item" onclick="cliccaItem(this, 'adiplon')">
                <p class="gallery-title">ADIPLON</p>
                <img src="../contenuti/Gemini_Generated_Image_ohqf0qohqf0qohqf (1).png" class="gallery-img" alt="Adiplon">
            </div>

            <div class="gallery-item" onclick="cliccaItem(this, 'albuphas')">
                <p class="gallery-title">ALBUPHAS</p>
                <img src="../contenuti/Gemini_Generated_Image_ohqf0qohqf0qohqf (1).png" class="gallery-img" alt="Albuphas">
            </div>

            <div class="gallery-item" onclick="cliccaItem(this, 'emolite')">
                <p class="gallery-title">EMOLITE</p>
                <img src="../contenuti/Gemini_Generated_Image_ohqf0qohqf0qohqf (1).png" class="gallery-img" alt="Emolite">
            </div>

            <div class="gallery-item" onclick="cliccaItem(this, 'keratex')">
                <p class="gallery-title">KERATEX</p>
                <img src="../contenuti/Gemini_Generated_Image_ohqf0qohqf0qohqf (1).png" class="gallery-img" alt="Keratex">
            </div>

        </div>
      
   </div>

   <footer style="color: rgb(29, 24, 21); z-index: 100;">
        <div class="grid-left">
            <p id="footer-brand" onclick="window.location.href='../index.html'" class="hover-effect" style="cursor: pointer;">SOEMA</p>
        </div>

        <div class="grid-center" id="footer-center"> 
            <p id="txt-address" style="display: block; margin:0; text-align: center;">
                20037, Via Roma 123, MI <br> info@soema.com
            </p>
        </div>

        <div class="grid-right" id="subscribe-container">
            <p id="btn-iscriviti" onclick="mostraForm()" class="hover-effect" style="cursor: pointer;">Iscriviti</p>
            <form id="form-iscriviti" style="display: none;" onsubmit="inviaMail(event)">
                <input type="email" placeholder="your@email.com" required>
                <button type="submit" class="hover-effect">Invia</button>
            </form>
        </div>
    </footer>

    <script>
        function cliccaItem(element, progetto) {
            const track = document.getElementById('gallery-track');
            const elementLeft = element.getBoundingClientRect().left;
            
            if (elementLeft < 50 && elementLeft > -50) {
                console.log("Apro progetto: " + progetto);
            } else {
                element.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'start' });
            }
        }

        function scorriAvantiLoop() {
            const track = document.getElementById('gallery-track');
            const item = track.querySelector('.gallery-item');
            let gap = window.innerWidth > 768 ? window.innerWidth * 0.65 : window.innerWidth * 0.20;
            let totalSlotWidth = item.offsetWidth + gap;
            let current = Math.round(track.scrollLeft / totalSlotWidth) + 1;

            if (current >= 4) {
                track.scrollTo({ left: 0, behavior: 'smooth' });
            } else {
                track.scrollBy({ left: totalSlotWidth, behavior: 'smooth' });
            }
        }

        function aggiornaContatore() {
            const track = document.getElementById('gallery-track');
            const item = track.querySelector('.gallery-item');
            let gap = window.innerWidth > 768 ? window.innerWidth * 0.65 : window.innerWidth * 0.20;
            let totalSlotWidth = item.offsetWidth + gap;
            let current = Math.round(track.scrollLeft / totalSlotWidth) + 1;
            
            if(current < 1) current = 1;
            if(current > 4) current = 4;
            document.getElementById('counter-display').innerText = current + "/4";
        }

        function mostraForm() {
            document.getElementById('btn-iscriviti').style.display = 'none';
            document.getElementById('form-iscriviti').style.display = 'flex';
        }

        function inviaMail(e) {
            e.preventDefault(); 
            document.getElementById('form-iscriviti').style.display = 'none';
            document.getElementById('btn-iscriviti').style.display = 'block';
        }
    </script>
</body>
</html>
